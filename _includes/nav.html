<nav class="sitenav" id="sitenav">
  <div class="{% unless page.nav_wrap == false %}wrap {% endunless %}sitenav-inner">
    <a href="/" class="sitenav-logo">Cimba<span>Hogs</span></a>
    <button class="sitenav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="sitenav-links">
      <span></span><span></span><span></span>
    </button>
    <ul class="sitenav-links" id="sitenav-links">
      <li><a href="/classfinder/"{% if page.url == '/classfinder/' %} aria-current="page"{% endif %}>Class Finder</a></li>
      <li><a href="/summer27application/" class="sitenav-cta"{% if page.url == '/summer27application/' %} aria-current="page"{% endif %}>Start Your Application</a></li>
    </ul>
  </div>
</nav>

<script>
(function(){
  var toggle = document.querySelector('.sitenav-toggle');
  var nav = document.getElementById('sitenav');
  if(!toggle || !nav) return;
  toggle.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('.sitenav-links a').forEach(function(link){
    link.addEventListener('click', function(){
      nav.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
