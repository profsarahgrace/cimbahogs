# Temporary: proves the Jekyll conversion builds with the same builder GitHub Pages uses.
# Runs only on the remove-banner branch and never deploys. Delete this file before merging to main.
name: Jekyll test build
on:
  push:
    branches: [remove-banner]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
